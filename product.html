<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品详情 | MICAI Packaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1A1208; --gold:#C9A96E; --warm-white:#FAF6F0; --border:rgba(201,169,110,0.2); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--ink); color:var(--warm-white); font-family:"Noto Serif SC",serif; min-height:100vh; }
    nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:20px 60px; background:rgba(26,18,8,0.95); border-bottom:1px solid var(--border); backdrop-filter:blur(10px); }
    .nav-logo { font-family:"Cormorant Garamond",serif; font-size:20px; color:var(--gold); text-decoration:none; font-weight:600; }
    .nav-back { display:flex; align-items:center; gap:8px; color:rgba(250,246,240,0.6); text-decoration:none; font-family:"Jost",sans-serif; font-size:14px; transition:color 0.3s; }
    .nav-back:hover { color:var(--gold); }
    .product-hero { padding:160px 60px 80px; max-width:1200px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:start; }
    .product-image { aspect-ratio:1/1; background:#221A0E; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:80px; overflow:hidden; }
    .product-image img { width:100%; height:100%; object-fit:cover; }
    .product-info { padding-top:20px; }
    .product-eyebrow { font-family:"Jost",sans-serif; font-size:12px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:20px; }
    .product-title { font-family:"Cormorant Garamond",serif; font-size:48px; font-weight:600; line-height:1.2; color:var(--warm-white); margin-bottom:24px; }
    .product-desc { font-size:15px; line-height:2; color:rgba(250,246,240,0.6); font-family:"Jost",sans-serif; font-weight:300; margin-bottom:48px; }
    .product-cta { display:inline-flex; align-items:center; gap:12px; padding:16px 32px; background:linear-gradient(135deg,var(--gold),#A07840); color:var(--ink); text-decoration:none; font-family:"Jost",sans-serif; font-size:14px; font-weight:500; letter-spacing:1px; text-transform:uppercase; transition:opacity 0.3s; }
    .product-cta:hover { opacity:0.85; }
    .loading { display:flex; align-items:center; justify-content:center; min-height:60vh; color:rgba(250,246,240,0.3); font-family:"Jost",sans-serif; }
    .more-products { padding:80px 60px; max-width:1200px; margin:0 auto; border-top:1px solid var(--border); }
    .more-title { font-family:"Cormorant Garamond",serif; font-size:28px; color:var(--warm-white); margin-bottom:40px; }
    .more-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
    .more-card { background:#221A0E; padding:32px 28px; cursor:pointer; transition:background 0.3s; }
    .more-card:hover { background:#2A200F; border:1px solid var(--border); }
    .more-card-icon { font-size:24px; margin-bottom:12px; }
    .more-card-name { font-size:15px; color:var(--warm-white); }
    footer { text-align:center; padding:40px; border-top:1px solid var(--border); color:rgba(250,246,240,0.3); font-family:"Jost",sans-serif; font-size:12px; }
    @media(max-width:768px) { nav{padding:16px 24px;} .product-hero{grid-template-columns:1fr;padding:120px 24px 60px;gap:40px;} .product-title{font-size:32px;} .more-products{padding:60px 24px;} .more-grid{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html">米彩包装 MICAI</a>
    <a class="nav-back" href="index.html#products">← 返回产品中心</a>
  </nav>
  <div id="app"><div class="loading">加载中...</div></div>
  <footer>米彩包装（温州）有限公司 &copy; 2025 MICAI Packaging (Wenzhou) Co., Ltd.</footer>
  <script>
    var API = "https://508mc-production.up.railway.app";
    var slug = new URLSearchParams(location.search).get("slug");
    if (!slug) location.href = "index.html";
    var lang = navigator.language.startsWith("de") ? "de"
             : navigator.language.startsWith("es") ? "es"
             : navigator.language.startsWith("zh") ? "zh" : "en";
    function getTrans(product, field) {
      var t = (product.translations || []).find(function(t){ return t.lang === lang; })
           || (product.translations || []).find(function(t){ return t.lang === "zh"; })
           || {};
      return t[field] || "";
    }
    Promise.all([
      fetch(API + "/api/products/" + slug).then(function(r){ return r.json(); }),
      fetch(API + "/api/products").then(function(r){ return r.json(); })
    ]).then(function(res) {
      var product = res[0];
      var allProducts = res[1];
      var name = getTrans(product, "name") || product.name || product.slug;
      var desc = getTrans(product, "description") || product.description || "";
      document.title = name + " | MICAI Packaging";
      var others = allProducts.filter(function(p){ return p.slug !== slug; }).slice(0, 3);
      var othersHtml = others.length ? "<div class=\"more-products\"><div class=\"more-title\">更多产品 More Products</div><div class=\"more-grid\">" +
        others.map(function(p) {
          var pname = getTrans(p, "name") || p.slug;
          var icon = p.imageUrl ? "<img src=\"" + p.imageUrl + "\" style=\"width:48px;height:48px;object-fit:cover;\" />" : (p.icon || "📦");
          return "<div class=\"more-card\" onclick=\"location.href='product.html?slug=" + p.slug + "'\"><div class=\"more-card-icon\">" + icon + "</div><div class=\"more-card-name\">" + pname + "</div></div>";
        }).join("") + "</div></div>" : "";
      var imgHtml = product.imageUrl ? "<img src=\"" + product.imageUrl + "\" alt=\"" + name + "\" />" : (product.icon || "📦");
      document.getElementById("app").innerHTML =
        "<div class=\"product-hero\"><div class=\"product-image\">" + imgHtml + "</div>" +
        "<div class=\"product-info\"><div class=\"product-eyebrow\">MICAI Packaging · 米彩包装</div>" +
        "<h1 class=\"product-title\">" + name + "</h1>" +
        "<p class=\"product-desc\">" + (desc || "专业定制高端纸制礼盒，满足您的品牌包装需求。") + "</p>" +
        "<a class=\"product-cta\" href=\"index.html#contact\">获取定制报价 Request a Quote</a></div></div>" + othersHtml;
    }).catch(function() {
      document.getElementById("app").innerHTML = "<div class=\"loading\">加载失败，<a href=\"index.html\" style=\"color:var(--gold)\">返回首页</a></div>";
    });
  </script>
</body>
</html>
